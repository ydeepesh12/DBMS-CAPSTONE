version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartchallan_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: traffic_challan
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./traffic_challan_dbms/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./traffic_challan_dbms/02_views_functions_triggers.sql:/docker-entrypoint-initdb.d/02_views_functions_triggers.sql
      - ./traffic_challan_dbms/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql
      - ./traffic_challan_dbms/04_sample_data.sql:/docker-entrypoint-initdb.d/04_sample_data.sql
      - ./traffic_challan_dbms/09_app_user.sql:/docker-entrypoint-initdb.d/09_app_user.sql
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: smartchallan_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartchallan_backend
    environment:
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: traffic_challan
      MONGO_URI: mongodb://mongodb:27017/traffic_challan
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: smart_challan_secret_jwt_key_2026_super_secure
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartchallan_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
